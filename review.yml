actions:
  openapiHarvested: false
  reason: >-
    No public OpenAPI/Swagger or API reference is published. The only
    first-party API host (api.liveoak.bank) is partner-gated with no public
    documentation, so nothing could be harvested verbatim. This is an
    honest identity + posture record.
